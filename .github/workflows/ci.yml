name: CI
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asd-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/asd-matplotlib
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.16'
      - name: Install exact evaluation and quality dependencies
        run: python -m pip install -r requirements/ci.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Compile all supported source files
        run: python -m compileall -q config.py src scripts tests
      - name: Check correctness lint rules
        run: ruff check config.py src scripts tests
      - name: Test RNN/data/cache contracts, metrics, splits and worker limits
        run: python -m unittest discover -s tests -v
      - name: Build checkpoint-required inference toolkit
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source=https://github.com/bmaged23/train-rnn-asd -f deployment/docker/Dockerfile -t asd-window-toolkit:ci .
      - name: Verify packaged CLI predictions and missing-weight failure
        run: python -m scripts.validation.validate_inference_container --image asd-window-toolkit:ci
      - name: Verify actual HTTP predictions and missing-checkpoint readiness
        run: python -m scripts.validation.validate_api_container --image asd-window-toolkit:ci
      - name: Publish tested toolkit and verify its public immutable image
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python -m scripts.release.publish_toolkit --image asd-window-toolkit:ci
      - name: Update and verify public Docker Hub overview
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python -m scripts.release.sync_dockerhub_overview
